# Render Blueprint：在 Render 选择 New → Blueprint，连接这个 GitHub 仓库即可。
services:
  - type: web
    name: maths-adventure-kingdom
    runtime: node
    plan: free
    region: singapore
    buildCommand: node scripts/verify-questions.js
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        sync: false
